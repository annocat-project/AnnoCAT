name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check strict VEP comparator
        run: python scripts/compare-vep-concordance.py --self-test
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1
      - name: Test AnnoCAT
        run: cargo test --workspace --locked -- --test-threads=1
